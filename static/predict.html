<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Flower Predictor</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b1220, #050814);
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      width: 380px;
      background: rgba(17, 24, 39, 0.9);
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    p {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 18px;
    }

    .label {
      font-size: 12px;
      color: #9ca3af;
      margin: 10px 0 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #0f172a;
      color: white;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.2);
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      background: #0f172a;
      border-radius: 12px;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #1d4ed8;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .confidence-bar {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 999px;
      margin-top: 8px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #3b82f6);
      transition: width 0.4s ease;
    }

    .loading {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🌸 Flower Predictor</h1>
    <p>AI model trained on Iris dataset</p>

    <div class="label">Sepal Length</div>
    <input id="f1" type="number" step="any">

    <div class="label">Sepal Width</div>
    <input id="f2" type="number" step="any">

    <div class="label">Petal Length</div>
    <input id="f3" type="number" step="any">

    <div class="label">Petal Width</div>
    <input id="f4" type="number" step="any">

    <button id="btn" onclick="predict()">Predict</button>

    <div class="result" id="result">
      Result will appear here
    </div>

  </div>

<script>
async function predict() {

  const btn = document.getElementById("btn");
  const result = document.getElementById("result");

  const features = [
    parseFloat(document.getElementById("f1").value),
    parseFloat(document.getElementById("f2").value),
    parseFloat(document.getElementById("f3").value),
    parseFloat(document.getElementById("f4").value)
  ];

  if (features.some(v => isNaN(v))) {
    result.innerHTML = "⚠️ Please fill all fields";
    return;
  }

  btn.disabled = true;
  result.innerHTML = `<div class="loading">Thinking...</div>`;

  try {

    const res = await fetch("/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ features })
    });

    const data = await res.json();

    const confidence = Math.round(data.confidence * 100);

    result.innerHTML = `
      <div class="badge">${data.prediction}</div>
      <div style="font-size:13px; color:#9ca3af;">
        Confidence: ${confidence}%
      </div>

      <div class="confidence-bar">
        <div class="confidence-fill" style="width:${confidence}%"></div>
      </div>
    `;

  } catch (err) {
    result.innerHTML = "❌ Error calling API";
  }

  btn.disabled = false;
}
</script>

</body>
</html>
