<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boring API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: #eef1f5;
            color: #222;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .section {
            background: white;
            padding: 22px;
            border-radius: 8px;
            margin-bottom: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .section h3 {
            margin-top: 0;
            margin-bottom: 14px;
            font-size: 16px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        textarea {
            height: 65px;
            resize: vertical;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            color: white;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        .add-btn { background-color: #4CAF50; }
        .edit-btn { background-color: #ff9800; }
        .delete-btn { background-color: #f44336; }
        .save-btn { background-color: #2196F3; }
        .cancel-btn { background-color: #888; }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 8px;
            background: #fafafa;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .item-details { flex: 1; }
        .item-details .name {
            font-weight: bold;
            font-size: 15px;
        }
        .item-details .desc {
            color: #777;
            font-size: 13px;
            margin-top: 3px;
        }
        .item-details .id-label {
            color: #bbb;
            font-size: 10px;
            font-family: monospace;
        }
        .item-buttons { display: flex; gap: 6px; margin-left: 10px; }

        .empty-msg {
            color: #aaa;
            font-style: italic;
            text-align: center;
            padding: 20px 0;
        }

        /* edit form inside an item row */
        .edit-inline { width: 100%; }
        .edit-inline input, .edit-inline textarea {
            margin-bottom: 8px;
        }
        .edit-inline .edit-buttons {
            display: flex;
            gap: 6px;
        }

        .item-count {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Boring API</h1>
    <p class="subtitle">Simple item manager for AIE300</p>

    <!-- create item form -->
    <div class="section">
        <h3>Add New Item</h3>
        <form id="createForm">
            <input type="text" id="nameInput" placeholder="Item name" required />
            <textarea id="descInput" placeholder="Description (optional)"></textarea>
            <button type="submit" class="add-btn">Add Item</button>
        </form>
    </div>

    <!-- items list -->
    <div class="section">
        <h3>All Items</h3>
        <div id="itemCount" class="item-count"></div>
        <div id="itemsList">Loading...</div>
    </div>

    <script>
        const API_URL = window.location.origin;

        // load all items from the api and display them
        async function loadItems() {
            let response = await fetch(API_URL + "/items");
            let data = await response.json();
            let container = document.getElementById("itemsList");
            let countEl = document.getElementById("itemCount");

            if (data.length === 0) {
                countEl.textContent = "";
                container.innerHTML = '<p class="empty-msg">No items yet, add one above!</p>';
                return;
            }

            countEl.textContent = data.length + " item" + (data.length === 1 ? "" : "s");

            let html = "";
            for (let i = 0; i < data.length; i++) {
                let item = data[i];
                let descText = item.description ? item.description : "No description";
                // mongo ids are long hex strings so we pass them as strings
                html += `
                    <div class="item-row" id="item-${item.id}">
                        <div class="item-details">
                            <div class="id-label">${item.id}</div>
                            <span class="name">${item.name}</span>
                            <div class="desc">${descText}</div>
                        </div>
                        <div class="item-buttons">
                            <button class="edit-btn" onclick="editItem('${item.id}', '${item.name.replace(/'/g, "\\'")}', '${(item.description || '').replace(/'/g, "\\'")}')">Edit</button>
                            <button class="delete-btn" onclick="deleteItem('${item.id}')">Delete</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // handle the create form submit
        document.getElementById("createForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            let name = document.getElementById("nameInput").value.trim();
            let desc = document.getElementById("descInput").value.trim();

            if (!name) return; // dont submit if empty

            await fetch(API_URL + "/items", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name: name, description: desc || null})
            });

            // clear the form and reload
            document.getElementById("nameInput").value = "";
            document.getElementById("descInput").value = "";
            loadItems();
        });

        // delete an item
        async function deleteItem(id) {
            await fetch(API_URL + "/items/" + id, {method: "DELETE"});
            loadItems();
        }

        // show edit form inline
        function editItem(id, currentName, currentDesc) {
            let row = document.getElementById("item-" + id);
            row.innerHTML = `
                <div class="edit-inline">
                    <input type="text" id="editName-${id}" value="${currentName}" />
                    <textarea id="editDesc-${id}">${currentDesc}</textarea>
                    <div class="edit-buttons">
                        <button class="save-btn" onclick="saveItem('${id}')">Save</button>
                        <button class="cancel-btn" onclick="loadItems()">Cancel</button>
                    </div>
                </div>
            `;
        }

        // save the edited item
        async function saveItem(id) {
            let name = document.getElementById("editName-" + id).value.trim();
            let desc = document.getElementById("editDesc-" + id).value.trim();
            if (!name) return;

            await fetch(API_URL + "/items/" + id, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({name: name, description: desc || null})
            });
            loadItems();
        }

        // load items when page opens
        loadItems();
    </script>
</body>
</html>
